version: "3.9"

services:
  api:
    image: myorg/api:latest
    privileged: true
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - JWT_SECRET=hardcoded_jwt_secret_999

  db:
    image: postgres
    ports:
      - "0.0.0.0:5432:5432"
    environment:
      - POSTGRES_PASSWORD=postgres_admin_pass
